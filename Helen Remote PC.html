/* v0.8: Helen handheld chat as a real desktop window. */
.win[data-win="helen"] .winbody{padding:0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.helen-chat{height:100%;min-height:0;display:flex;flex-direction:column;background:linear-gradient(153deg,rgba(92,125,192,.09),transparent 53%)}
.helen-chat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line);flex-shrink:0;background:rgba(69,95,157,.075)}
.helen-chat-top .labelblock{display:flex;align-items:center;gap:9px;min-width:0}
.helen-chat-top h1{margin:0;font-size:15px;line-height:1.1}
.helen-chat-top .small{font-size:10px;margin:2px 0 0}
.helen-presence{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 33% 27%,#f8fdff 2%,#aac8ff 19%,#7079ed 59%,#342860 98%);box-shadow:0 0 14px rgba(147,161,255,.45);animation:helenBreathe 3.6s ease-in-out infinite}
@keyframes helenBreathe{50%{transform:scale(1.09);box-shadow:0 0 23px rgba(147,161,255,.62)}}
.helen-status{font-size:10px;padding:5px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);white-space:nowrap;background:var(--glass)}
.helen-status.live{color:#8ff5c6;border-color:#69bdac61}
.helen-feed{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;min-height:0;user-select:text;-webkit-user-select:text}
.helen-empty{margin:auto;text-align:center;max-width:310px;color:var(--muted);font-size:12px;line-height:1.7;padding:18px}
.helen-empty strong{display:block;color:var(--ink);font-size:14px;margin:6px 0}
.helen-bubble{max-width:83%;width:fit-content;border-radius:13px 13px 13px 4px;border:1px solid var(--line);background:rgba(79,106,167,.16);padding:9px 12px;box-shadow:0 5px 18px #0002;line-height:1.47;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.helen-bubble.user{align-self:flex-end;border-radius:13px 13px 4px 13px;background:linear-gradient(125deg,#455dd0,#4c80c6);border-color:#b7d0ff29;color:white}
.helen-bubble.error{background:rgba(178,71,94,.13);border-color:rgba(241,132,132,.25);color:var(--ink)}
.helen-bubble .who{display:block;font-size:9px;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:4px}
.helen-bubble.user .who{color:#d6e6ff}
.helen-chat-bottom{border-top:1px solid var(--line);background:rgba(13,22,44,.15);padding:9px 12px 10px;flex-shrink:0}
.helen-composer{display:flex;align-items:flex-end;gap:9px;border:1px solid var(--line);background:var(--glass2);border-radius:13px;padding:6px 7px 6px 11px}
.helen-composer textarea{display:block;flex:1;resize:none;min-width:0;max-height:95px;min-height:32px;outline:none;border:0;background:transparent;font-family:inherit;font-size:13px;line-height:1.4;padding:7px 2px;color:var(--ink);user-select:text;-webkit-user-select:text}
.helen-composer textarea:focus{outline:0}
.helen-send{display:grid;place-items:center;flex-shrink:0;width:37px;height:37px;border-radius:10px;background:linear-gradient(132deg,#617cf2,#518fd8);color:#fff;font-size:17px;font-weight:750}
.helen-send:disabled{opacity:.45;cursor:not-allowed}
.helen-tools{display:flex;justify-content:space-between;gap:7px;align-items:center;padding:0 0 7px}
.helen-tools button{color:var(--muted);border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:10px}
.helen-tools button:hover{color:var(--ink);background:rgba(117,145,213,.15)}
.helen-composer-help{font-size:9px;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between;gap:8px}

// Handheld chat UI; messages remain in memory while the page is open. PC keeps a separate mirrored log.
let phoneChat=[],chatBusy=false,chatDraft='',chatHistoryLoaded=false,chatHistoryRequest=0,chatError='';
const chatPreview=location.search.includes('preview=chat');
if(chatPreview){phoneChat=[{role:'helen',content:'Hello! The handheld conversation window is ready. This is a visual preview, not an AI response.'},{role:'user',content:'Can we work from the phone desktop?'},{role:'helen',content:'The phone is the interface, and Windows hosts the original Helen engine. Pair them to start a real conversation.'}];chatHistoryLoaded=true}
function helenChatMarkup(){
  const ready=mode==='live';
  const feed=phoneChat.length?phoneChat.map(m=>`<div class="helen-bubble ${m.role==='user'?'user':m.role==='error'?'error':''}"><span class="who">${m.role==='user'?'YOU':m.role==='error'?'STATUS':'HELEN'}</span>${esc(m.content)}</div>`).join(''):`<div class="helen-empty"><span style="font-size:25px">✧</span><strong>Your conversation with Helen</strong>${ready?'Type below to speak with the original Helen running on your computer.':'Connect to your computer to talk to Helen. You can still explore the desktop offline.'}</div>`;
  return `<section class="helen-chat" aria-label="Helen conversation"><div class="helen-chat-top"><div class="labelblock"><span class="helen-presence" aria-hidden="true"></span><div><h1>Helen</h1><p class="small muted">${chatPreview?'VISUAL PREVIEW':ready?'Original engine · Windows PC':'Waiting for Windows host'}</p></div></div><span class="helen-status ${ready?'live':''}" id="helen-presence-state">${chatBusy?'Thinking…':ready?'● Connected':'○ Offline'}</span></div><div class="helen-feed" id="helen-feed" aria-live="polite">${feed}</div><div class="helen-chat-bottom"><div class="helen-tools"><button type="button" data-helen-refresh="1">↻ Sync conversation</button><span class="small muted" id="helen-chat-warning">${esc(chatError||(chatHistoryLoaded?'Phone conversation log':'History loads when connected'))}</span></div><form class="helen-composer" id="helen-compose-form"><textarea id="helen-message-input" rows="1" maxlength="1500" placeholder="${ready?'Message Helen…':'Connect to PC to message Helen…'}" aria-label="Message Helen">${esc(chatDraft)}</textarea><button class="helen-send" id="helen-send-button" type="submit" ${chatBusy||!ready?'disabled':''} title="Send message">➤</button></form><div class="helen-composer-help"><span>Enter to send · Shift+Enter for newline</span><span id="helen-count">${chatDraft.length}/1500</span></div></div></section>`;
}
function paintHelenChat({preserveInput=true}={}){
  const body=document.querySelector('#win-helen .winbody');if(!body)return;
  if(preserveInput){const input=document.getElementById('helen-message-input');if(input)chatDraft=input.value}
  body.innerHTML=helenChatMarkup();
  const feed=document.getElementById('helen-feed');if(feed)feed.scrollTop=feed.scrollHeight;
}
async function loadPhoneChat(){
  if(mode!=='live'){toast('Connect to your computer to sync chat');return;}
  if(chatBusy)return;
  const id=++chatHistoryRequest;
  try{const data=await request('/api/helen/phone-history');if(id!==chatHistoryRequest)return;
    if(!Array.isArray(data.messages))throw Error('Invalid history response');
    phoneChat=data.messages.filter(m=>['user','helen'].includes(m.role)&&typeof m.content==='string');
    chatHistoryLoaded=true;chatError='';paintHelenChat();
  }catch(err){if(id!==chatHistoryRequest)return;chatError='Could not sync: '+err.message;paintHelenChat()}
}
async function sendHelenChat(){
  const field=document.getElementById('helen-message-input');
  const message=(field?.value||chatDraft).trim();
  if(!message||chatBusy)return;
  if(mode!=='live'){toast('Connect to the Windows host first');return}
  if(message.length>1500){toast('Message exceeds 1500 characters');return}
  chatBusy=true;chatError='';chatDraft='';phoneChat.push({role:'user',content:message});paintHelenChat(false);
  try{
    const answer=await request('/api/helen/chat',{method:'POST',body:{message}});
    if(answer.reply){phoneChat.push({role:'helen',content:answer.reply});}
    else{phoneChat.push({role:'error',content:'Helen received your message, but no text reply was captured. Check her original window on the PC.'});}
    if(answer.warning)chatError=answer.warning;
    // Keep this response visible. Fresh history can be fetched after processing finishes.
  }catch(err){if(phoneChat.at(-1)?.role==='user'&&phoneChat.at(-1)?.content===message)phoneChat.pop();phoneChat.push({role:'error',content:'Message not confirmed: '+err.message});chatDraft=message;}
  finally{chatBusy=false;paintHelenChat(false);const input=document.getElementById('helen-message-input');if(input&&chatDraft)input.value=chatDraft;}
}
function contents(id){if(id==='welcome')return `<div class="tiny">HELEN / HANDHELD EDITION · V0.8</div><h1>Your PC. In your hands.</h1><p class="muted small">A real desktop-style experience on your phone, designed for touch and controller navigation.</p><div class="panel" style="margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;gap:8px"><div><div class="tiny">CONNECTION STATUS</div><div style="font-size:13px;font-weight:750;margin-top:5px">${mode==='live'?'Connected to '+esc(host||'PC'):'Demo workspace'}</div><div class="muted small">${mode==='live'?'Phone-to-PC bridge is active':'Explore without your computer'}</div></div><span class="chip ${mode==='live'?'success':''}">${mode==='live'?'LIVE':'DEMO'}</span></div><div class="grid"><button class="tile" data-open="controller">${I('pad')} Controller Lab</button><button class="tile" data-open="files">${I('folder')} File Explorer</button><button class="tile" data-open="engine">${I('apps')} Engine Hub</button></div><div class="actions"><button class="btn primary" data-connect="1">${I('wifi')} Connect PC</button><button class="btn" data-fullscreen="1">${I('monitor')} Full screen</button></div><div class="small muted">Tip: turn your phone sideways for the full handheld layout. Your Windows host is not modified by this preview.</div>`;
if(id==='files')return `<div class="row between"><div><div class="tiny">STORAGE</div><h1>File Explorer</h1></div><span class="chip">${mode==='live'?'LIVE WORKSPACE':'DEMO FILES'}</span></div><div class="actions"><button class="btn" data-newfolder="1">${I('plus')} New folder</button><button class="btn" data-newnote="1">${I('file')} New note</button><button class="btn" data-refresh-files="1">Refresh</button></div><div id="filecrumb" class="muted small">HELEN Workspace</div><div id="filelist" class="list"><div class="small muted">Loading files…</div></div>`;
if(id==='engine')return `<div class="tiny">APPLICATIONS / SERVICES</div><h1>Engine Hub</h1><p class="small muted">The future home of your original applications. These are placeholders until their adapters are built.</p><div class="list">${[['Helen AI','brain','Integration planned'],['BuildView XR','layers','Integration planned'],['Bible Workbench','book','Integration planned'],['Music Studio','music','Integration planned']].map(x=>`<button class="listitem" data-toast="${x[0]} will be connected later"><span class="app-icon ${x[1]==='brain'?'rose':'purple'}" style="width:33px;height:33px">${I(x[1])}</span><span class="grow"><strong>${x[0]}</strong><br><small>${x[2]}</small></span>${I('chevron')}</button>`).join('')}</div>`;
if(id==='helen')return helenChatMarkup();
if(id==='system')return `<div class="tiny">MONITOR / HOST</div><h1>System</h1><p class="small muted">Live computer details are available when paired with the existing host.</p><div class="grid" id="sysgrid"><div class="panel">${I('monitor')}<div class="tiny">HOST</div><strong>${mode==='live'?esc(host):'Demo mode'}</strong></div><div class="panel">${I('shield')}<div class="tiny">MEMORY</div><strong>Planned</strong></div><div class="panel">${I('wifi')}<div class="tiny">CONNECTION</div><strong>${mode==='live'?'Live':'Not paired'}</strong></div></div><div class="actions"><button class="btn" data-connect="1">Pair with PC</button><button class="btn" data-open="settings">Appearance</button></div>`;
if(id==='controller')return `<div class="row between"><div><div class="tiny">INPUT DEVICES / BETA</div><h1>Controller Lab</h1></div><span class="chip" id="pad-chip">SCANNING</span></div><p class="small muted">Connect your Play force controller to Android using its supported Bluetooth mode, then press a button. This screen identifies the browser's actual axis/button numbers.</p><div class="panel" style="display:flex;align-items:center;gap:14px"><div style="font-size:28px;color:var(--bright)">${I('pad')}</div><div><strong id="pad-name">Searching for gamepad…</strong><div class="small muted" id="pad-extra">Controller input not detected yet</div></div></div><h2>Live inputs</h2><div id="pad-inputs" class="panel small muted">Connect a controller and press a button.</div><h2>Suggested desktop controls</h2><div class="hgroup">${['Left stick: cursor','A / Button 0: click','B / Button 1: back','LB / RB: switch','Start: menu'].map(x=>`<span class="badge">${x}</span>`).join('')}</div><div class="small muted" style="margin-top:10px">Mapping is provisional. Controller button indices can vary, so verify them here before relying on shortcuts.</div><div class="actions"><button class="btn" data-togglecursor="1">Toggle test cursor</button><button class="btn" data-fullscreen="1">Full screen</button></div>`;
if(id==='settings')return `<div class="tiny">PERSONALIZATION</div><h1>Appearance</h1><p class="small muted">Make this handheld desktop feel like yours.</p><label class="label" for="theme-select">Glass finish</label><select id="theme-select"><option value="aurora" ${theme==='aurora'?'selected':''}>Aurora · deep blue</option><option value="silver" ${theme==='silver'?'selected':''}>Silver · bright glass</option><option value="obsidian" ${theme==='obsidian'?'selected':''}>Obsidian · dark violet</option></select><label class="label" for="motion-select">Animation level</label><select id="motion-select"><option value="flow" ${motion==='flow'?'selected':''}>Flow · normal</option><option value="calm" ${motion==='calm'?'selected':''}>Calm · subtle</option><option value="off" ${motion==='off'?'selected':''}>Off · reduce motion</option></select><div class="actions"><button class="btn" data-fullscreen="1">${I('monitor')} Full screen</button></div><p class="small muted">For app-like full-screen on Android, host over HTTPS and add to your home screen. Chrome's browser controls cannot always be hidden from a normal tab.</p>`;
return '<p>Unknown application.</p>'}
function showWindow(id){if(!appDefs.some(a=>a.id===id))return;if(windows.has(id)){const w=windows.get(id);w.min=false;focus(id);syncWindow(id);return}const pos=panelPos(id);if(id==='helen'){pos.left=Math.max(7,innerWidth*.085);pos.top=5;pos.width=Math.min(850,innerWidth*.83);pos.height=Math.max(190,innerHeight-106)}windows.set(id,{...pos,z:++z,min:false,max:false});focus(id);syncWindow(id);taskbar();if(id==='files')refreshFiles();if(id==='system')refreshSystem();if(id==='controller')refreshPadUI();if(id==='helen'){paintHelenChat();if(mode==='live'&&!chatHistoryLoaded)loadPhoneChat()}}
function syncWindow(id){let data=windows.get(id),area=$('#win-layer');if(!data)return;let win=document.getElementById('win-'+id);let def=appDefs.find(a=>a.id===id);if(!win){win=document.createElement('section');win.className='win';win.id='win-'+id;win.dataset.win=id;win.innerHTML=`<div class="winbar" data-drag="${id}"><div class="winbar-title">${I(def.ico)} ${esc(def.name)}</div><div class="wincontrols"><button class="wincontrol" data-op="min" data-target="${id}" title="Minimize">—</button><button class="wincontrol" data-op="max" data-target="${id}" title="Maximize">□</button><button class="wincontrol" data-op="close" data-target="${id}" title="Close">×</button></div></div><div class="winbody">${contents(id)}</div>`;area.append(win)}win.style.left=data.left+'px';win.style.top=data.top+'px';win.style.width=data.width+'px';win.style.height=data.height+'px';win.style.zIndex=data.z;win.classList.toggle('focused',id===focused);win.classList.toggle('maximized',!!data.max);win.style.display=data.min?'none':'flex'}
function focus(id){focused=id;let win=windows.get(id);if(win)win.z=++z;for(let k of windows.keys()){let el=document.getElementById('win-'+k);if(el){el.classList.toggle('focused',k===id);el.style.zIndex=windows.get(k).z}}taskbar()}
function operate(id,op){let w=windows.get(id);if(!w)return;if(op==='close'){windows.delete(id);document.getElementById('win-'+id)?.remove();focused='';const others=[...windows.keys()];if(others.length)focus(others.at(-1))}else if(op==='min'){w.min=true;w.max=false;syncWindow(id)}else if(op==='max'){w.max=!w.max;w.min=false;syncWindow(id)}taskbar()}
function toggleTask(id){if(!windows.has(id))return showWindow(id);const w=windows.get(id);if(id===focused&&!w.min){operate(id,'min');return}w.min=false;focus(id);syncWindow(id)}
let currentFolder='';function getDemoFiles(path){const prefix=path?path+'/':'';let out=new Map;for(let filename of Object.keys(filesDemo)){if(!filename.startsWith(prefix))continue;let rest=filename.slice(prefix.length);if(!rest)continue;let part=rest.split('/')[0],folder=rest.includes('/');if(!out.has(part))out.set(part,{name:part,path:prefix+part,type:folder?'folder':'file'})}return [...out.values()]}
let loadNum=0;async function refreshFiles(){const root=$('#filelist');if(!root)return;const current=++loadNum;$('#filecrumb').textContent='HELEN Workspace'+(currentFolder?' / '+currentFolder:'');root.innerHTML='<div class="small muted">Loading…</div>';try{let entries;if(mode==='live'){const r=await request('/api/files?path='+encodeURIComponent(currentFolder));entries=r.entries||[]}else entries=getDemoFiles(currentFolder);if(current!==loadNum||!$('#filelist'))return;root.innerHTML=entries.length?entries.map(e=>`<button class="listitem" data-file-path="${esc(e.path)}" data-file-type="${esc(e.type)}">${I(e.type==='folder'?'folder':'file')}<div class="grow"><strong>${esc(e.name)}</strong><br><small>${e.type==='folder'?'Folder':'Document'}</small></div>${I('chevron')}</button>`).join(''):'<div class="panel muted small">No items in this folder.</div>';if(currentFolder)root.insertAdjacentHTML('afterbegin',`<button class="listitem" data-file-back="1">${I('chevron')} .. Back</button>`)}catch(e){if(current===loadNum&&$('#filelist'))$('#filelist').textContent='Unable to load: '+e.message}}
async function openFile(path,type){if(type==='folder'){currentFolder=path;refreshFiles();return}try{let content=mode==='live'?(await request('/api/file?path='+encodeURIComponent(path))).content:filesDemo[path];openDialog(`<h2>${esc(path.split('/').at(-1))}</h2><textarea id="file-editor"></textarea><div class="actions"><button class="btn primary" data-savefile="${esc(path)}">Save</button><button class="btn" data-dismiss="1">Cancel</button></div>`);$('#file-editor').value=content||''}catch(e){toast(e.message)}}
function openDialog(html){$('#dialogbox').innerHTML=html;$('#dialog').hidden=false}function closeDialog(){$('#dialog').hidden=true;$('#dialogbox').innerHTML=''}
async function createItem(kind){const name=prompt(kind==='folder'?'Name your new folder':'Name your new note (e.g. Ideas.txt)');if(!name)return;if(!/^[^/\\]{1,80}$/.test(name)){toast('Invalid name');return}const path=(currentFolder?currentFolder+'/':'')+name;try{if(mode==='live'){if(kind==='folder')await request('/api/folder/create',{method:'POST',body:{path}});else await request('/api/file/save',{method:'POST',body:{path,content:''}})}else filesDemo[kind==='folder'?path+'/.keep.txt':path]='';refreshFiles();toast('Created '+name)}catch(e){toast(e.message)}}
async function refreshSystem(){if(mode!=='live')return;try{let d=await request('/api/system');const box=$('#sysgrid');if(box)box.innerHTML=[['HOST',d.host],['OS',d.os],['PYTHON',d.python],['CPU CORES',d.cpu_cores]].map(([a,b])=>`<div class="panel"><div class="tiny">${a}</div><strong>${esc(b||'—')}</strong></div>`).join('')}catch(e){toast(e.message)}}

let peer=null,conn=null,seq=0;const waiting=new Map();function disconnect(){for(const [id,r] of waiting){clearTimeout(r.timer);r.reject(Error('Disconnected'))}waiting.clear();try{conn?.close()}catch{}try{peer?.destroy()}catch{}conn=null;peer=null;mode='demo';host='';updateStatus()}
function loadPeer(){if(window.Peer)return Promise.resolve();return new Promise((res,rej)=>{let s=document.createElement('script'),timer=setTimeout(()=>rej(Error('PeerJS unavailable')),15000);s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';s.onload=()=>{clearTimeout(timer);window.Peer?res():rej(Error('Pairing library unavailable'))};s.onerror=()=>{clearTimeout(timer);rej(Error('Could not load pairing library'))};document.head.append(s)})}
async function pair(code){if(!/^\d{10}$/.test(code))throw Error('Please enter a 10-digit code');disconnect();await loadPeer();return new Promise((resolve,reject)=>{let done=false,ready=false;const timer=setTimeout(()=>fail('Pairing timed out'),70000);function fail(s){if(done)return;done=true;clearTimeout(timer);disconnect();reject(Error(s))}const p=peer=new Peer({host:'0.peerjs.com',port:443,secure:true,debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});p.on('open',()=>{if(done)return;setPairText('Waiting for PC approval…');const c=conn=p.connect('helen-02-'+code,{reliable:true,serialization:'json',metadata:{type:'HELEN Desktop'}});c.on('data',m=>{if(!m||typeof m!=='object')return;if(m.type==='rejected')return fail(m.reason||'Rejected');if(m.type==='ready'){if(done)return;ready=true;done=true;clearTimeout(timer);resolve();return}if(m.type==='response'){let item=waiting.get(m.id);if(!item)return;waiting.delete(m.id);clearTimeout(item.timer);m.ok?item.resolve(m.data):item.reject(Error(m.error||'Request failed'))}});c.on('close',()=>{if(!ready)fail('Closed before approval');else{disconnect();toast('PC disconnected')}});c.on('error',e=>{if(!ready)fail(e.message||'Pairing failed');else{disconnect();toast('PC connection lost')}})});p.on('error',e=>{if(!ready)fail('Pairing service: '+(e.type||e.message))})})}
function request(path,{method='GET',body}={}){if(!conn?.open)return Promise.reject(Error('PC not connected'));const id='h'+(++seq)+'-'+Math.random().toString(36).slice(2,6);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{waiting.delete(id);reject(Error('PC request timed out'))},path.startsWith('/api/helen/')?65000:18000);waiting.set(id,{resolve,reject,timer});try{conn.send({type:'request',id,path,method,body})}catch(e){clearTimeout(timer);waiting.delete(id);reject(e)}})}
function setPairText(t){let s=$('#pair-status');if(s)s.textContent=t}
function updateStatus(){$('#connection-state').textContent=mode==='live'?'PC CONNECTED':'VISUAL DEMO';$('#statusdot').className='dot '+mode;$('#live-name').textContent=mode==='live'?'PC ONLINE':'DEMO';if(windows.has('welcome'))repaint('welcome');if(windows.has('system'))repaint('system');if(windows.has('helen'))paintHelenChat()}
function repaint(id){let el=document.querySelector('#win-'+id+' .winbody');if(el)el.innerHTML=contents(id)}
function doFullscreen(){let shell=$('#shell');if(!document.fullscreenElement){(shell.requestFullscreen?.()||Promise.reject()).catch(()=>toast('Use Add to Home Screen for immersive mode'))}else document.exitFullscreen?.()}
function orbPulse(){let el=$('#orbwrap');el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),2400);toast('Helen orb animation preview — no microphone or AI connected')}
// Pointer-based dragging of desktop windows.
let drag=null;document.addEventListener('pointerdown',e=>{let bar=e.target.closest('[data-drag]');if(!bar||e.target.closest('button'))return;let id=bar.dataset.drag,win=windows.get(id);if(!win||win.max)return;focus(id);drag={id,x:e.clientX,y:e.clientY,l:win.left,t:win.top,pointer:e.pointerId,element:bar};try{bar.setPointerCapture(e.pointerId)}catch{}});
document.addEventListener('pointermove',e=>{if(!drag||drag.pointer!==e.pointerId)return;let data=windows.get(drag.id);if(!data)return;data.left=Math.max(0,Math.min(innerWidth-90,drag.l+e.clientX-drag.x));data.top=Math.max(0,Math.min(innerHeight-135,drag.t+e.clientY-drag.y));syncWindow(drag.id)});document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pointer)drag=null});document.addEventListener('pointercancel',()=>drag=null);
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;let a=el.dataset;if(a.open){$('#startpanel').hidden=true;showWindow(a.open);return}if(a.taskwin){toggleTask(a.taskwin);return}if(a.op){operate(a.target,a.op);return}if(a.toast){toast(a.toast);return}if(a.connect){$('#startpanel').hidden=true;connectDialog();return}if(a.dismiss){closeDialog();return}if(a.fullscreen){doFullscreen();return}if(a.orbPulse){orbPulse();return}if(a.newfolder){createItem('folder');return}if(a.newnote){createItem('file');return}if(a.refreshFiles){refreshFiles();return}if(a.fileBack){currentFolder=currentFolder.split('/').slice(0,-1).join('/');refreshFiles();return}if(a.filePath){openFile(a.filePath,a.fileType);return}if(a.savefile){try{let content=$('#file-editor').value;if(mode==='live')await request('/api/file/save',{method:'POST',body:{path:a.savefile,content}});else filesDemo[a.savefile]=content;closeDialog();toast('Saved')}catch(err){toast(err.message)}return}if(a.pair){const code=$('#pair-code').value.replace(/\D/g,'');try{setPairText('Connecting…');await pair(code);let d=await request('/api/status');mode='live';host=d.host||'PC';updateStatus();closeDialog();toast('Windows PC connected');chatHistoryLoaded=false;loadPhoneChat()}catch(err){setPairText(err.message)}return}if(a.disconnect){disconnect();closeDialog();toast('Disconnected');return}if(a.togglecursor){gamepadCursor=!gamepadCursor;$('#pointer').classList.toggle('visible',gamepadCursor);toast(gamepadCursor?'Test cursor enabled':'Test cursor hidden');return}});
document.addEventListener('submit',e=>{if(e.target.id==='helen-compose-form'){e.preventDefault();sendHelenChat()}});document.addEventListener('click',e=>{if(e.target.closest('[data-helen-refresh]'))loadPhoneChat()});
$('#orb').onclick=()=>{showWindow('helen')};$('#start-button').onclick=startMenu;$('#dialog').onclick=e=>{if(e.target.id==='dialog')closeDialog()};document.addEventListener('input',e=>{if(e.target.id==='start-search'){$$('#start-items button').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()))}if(e.target.id==='helen-message-input'){chatDraft=e.target.value;const count=$('#helen-count');if(count)count.textContent=chatDraft.length+'/1500';e.target.style.height='auto';e.target.style.height=Math.min(95,e.target.scrollHeight)+'px'}});const $$=s=>[...document.querySelectorAll(s)];document.addEventListener('change',e=>{if(e.target.id==='theme-select'){theme=e.target.value;save('helen-handheld-theme',theme);applyTheme()}if(e.target.id==='motion-select'){motion=e.target.value;save('helen-handheld-motion',motion);applyTheme()}});document.addEventListener('keydown',e=>{if(e.target.id==='helen-message-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendHelenChat();return}if(e.key==='Escape'){if(!$('#dialog').hidden)closeDialog();else if(!$('#startpanel').hidden)$('#startpanel').hidden=true;else if(focused)operate(focused,'min')}if(e.key==='F11')doFullscreen()});
// Generic Gamepad API: detect controller, show actual mappings and use provisional browser button indices.
let lastPad=null,gamepadCursor=false,px=innerWidth*.55,py=innerHeight*.55,lastFrame=performance.now(),lastPadButtons=[],lastTrigger=0,padDirection=0,padSwitch=0;
function padOf(){try{return [...(navigator.getGamepads?.()||[])].find(g=>g&&g.connected)||null}catch{return null}}
function gameLoop(t){let dt=Math.min(50,t-lastFrame);lastFrame=t;const pad=padOf();if(pad){if(!lastPad||lastPad.id!==pad.id){lastPad=pad;toast('Controller detected');gamepadCursor=true;$('#pointer').classList.add('visible')};const ax=pad.axes||[],b=pad.buttons||[];const dx=Math.abs(ax[0]||0)>.16?ax[0]:0,dy=Math.abs(ax[1]||0)>.16?ax[1]:0;if(dx||dy){px=Math.max(2,Math.min(innerWidth-24,px+dx*dt*.65));py=Math.max(1,Math.min(innerHeight-27,py+dy*dt*.65));gamepadCursor=true};if(gamepadCursor){const cursor=$('#pointer');cursor.classList.add('visible');cursor.style.left=px+'px';cursor.style.top=py+'px'};const press=n=>(b[n]?.pressed||false),edge=n=>press(n)&&!lastPadButtons[n];if(edge(0)){let hit=document.elementFromPoint(px+4,py+4);if(hit){let btn=hit.closest('button');if(btn)btn.click();else if(hit.closest('.win'))focus(hit.closest('.win').dataset.win)}}if(edge(1)){if(!$('#dialog').hidden)closeDialog();else if(!$('#startpanel').hidden)$('#startpanel').hidden=true;else if(focused)operate(focused,'min')}if(edge(9))startMenu();if(edge(4)||edge(5)){const arr=[...windows.keys()];if(arr.length){let idx=arr.indexOf(focused)+(edge(5)?1:-1);let target=arr[(idx+arr.length)%arr.length];toggleTask(target)}}let sx=ax[2]||0,sy=ax[3]||0;if(Math.abs(sy)>.25){let visible=windows.get(focused);let node=visible&&document.querySelector('#win-'+focused+' .winbody');if(node)node.scrollTop+=sy*dt*.32}lastPadButtons=b.map(x=>!!x.pressed);$('#controller-status').classList.add('detected');$('#gamepad-status-icon').textContent='●';$('#gamepad-status-text').textContent='Pad ready';if(windows.has('controller')&&t-lastTrigger>150){lastTrigger=t;refreshPadUI(pad)}}else{if(lastPad){lastPad=null;lastPadButtons=[];toast('Controller disconnected')}$('#gamepad-status-icon').textContent='◌';$('#gamepad-status-text').textContent='Controller off';if(!gamepadCursor)$('#pointer').classList.remove('visible');if(windows.has('controller')&&t-lastTrigger>600){lastTrigger=t;refreshPadUI(null)}}requestAnimationFrame(gameLoop)}
function refreshPadUI(p=padOf()){const chip=$('#pad-chip'),name=$('#pad-name'),extra=$('#pad-extra'),inputs=$('#pad-inputs');if(!chip)return;chip.textContent=p?'DETECTED':'WAITING';name.textContent=p?(p.id||'Bluetooth gamepad'):'No controller detected';extra.textContent=p?`${p.buttons.length} buttons · ${p.axes.length} axes · mapping: ${p.mapping||'unknown'}`:'Pair with Android Bluetooth, then press a button';inputs.textContent=p?`Axes: ${p.axes.map((v,i)=>`${i}: ${v.toFixed(2)}`).join('  |  ')}\nButtons pressed: ${p.buttons.map((v,i)=>v.pressed?i:null).filter(v=>v!==null).join(', ')||'none'}`:'No gamepad data yet.';inputs.style.whiteSpace='pre-wrap'}
function clock(){let d=new Date();$('#topclock').textContent=$('#taskclock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#taskdate').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'})}clock();setInterval(clock,14000);
window.addEventListener('resize',()=>{px=Math.min(px,innerWidth-25);py=Math.min(py,innerHeight-25);for(let [id,w] of windows)if(!w.max){w.left=Math.min(w.left,Math.max(0,innerWidth-250));w.top=Math.min(w.top,Math.max(0,innerHeight-160));syncWindow(id)}});

buildIcons();taskbar();showWindow('welcome');requestAnimationFrame(gameLoop);
})();
