/* v1.0.1 — long names belong inside the icon, on two lines. */
.desktop-icon{padding:2px 1px;min-width:0}
.desktop-icon > span:last-child{white-space:normal;font-size:clamp(9px,1.55vw,10px);overflow-wrap:anywhere;word-break:normal;max-width:100%;text-align:center;line-height:1.13;min-height:22px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-shadow:0 1px 4px #0006}
.goal-card input[type=checkbox]:disabled{opacity:.55;cursor:progress}
.goal-feedback{font-size:11px;color:var(--muted);margin:5px 0}
/* v0.8: Helen handheld chat as a real desktop window. */
.win[data-win="helen"] .winbody{padding:0;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.helen-chat{height:100%;min-height:0;display:flex;flex-direction:column;background:linear-gradient(153deg,rgba(92,125,192,.09),transparent 53%)}
.helen-chat-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line);flex-shrink:0;background:rgba(69,95,157,.075)}
.helen-chat-top .labelblock{display:flex;align-items:center;gap:9px;min-width:0}
.helen-chat-top h1{margin:0;font-size:15px;line-height:1.1}
.helen-chat-top .small{font-size:10px;margin:2px 0 0}
.helen-presence{width:30px;height:30px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 33% 27%,#f8fdff 2%,#aac8ff 19%,#7079ed 59%,#342860 98%);box-shadow:0 0 14px rgba(147,161,255,.45);animation:helenBreathe 3.6s ease-in-out infinite}
@keyframes helenBreathe{50%{transform:scale(1.09);box-shadow:0 0 23px rgba(147,161,255,.62)}}
.helen-status{font-size:10px;padding:5px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted);white-space:nowrap;background:var(--glass)}
.helen-status.live{color:#8ff5c6;border-color:#69bdac61}
.helen-feed{flex:1;overflow:auto;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;min-height:0;user-select:text;-webkit-user-select:text}
.helen-empty{margin:auto;text-align:center;max-width:310px;color:var(--muted);font-size:12px;line-height:1.7;padding:18px}
.helen-empty strong{display:block;color:var(--ink);font-size:14px;margin:6px 0}
.helen-bubble{max-width:83%;width:fit-content;border-radius:13px 13px 13px 4px;border:1px solid var(--line);background:rgba(79,106,167,.16);padding:9px 12px;box-shadow:0 5px 18px #0002;line-height:1.47;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.helen-bubble.user{align-self:flex-end;border-radius:13px 13px 4px 13px;background:linear-gradient(125deg,#455dd0,#4c80c6);border-color:#b7d0ff29;color:white}
.helen-bubble.error{background:rgba(178,71,94,.13);border-color:rgba(241,132,132,.25);color:var(--ink)}
.helen-bubble .who{display:block;font-size:9px;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:4px}
.helen-bubble.user .who{color:#d6e6ff}
.helen-chat-bottom{border-top:1px solid var(--line);background:rgba(13,22,44,.15);padding:9px 12px 10px;flex-shrink:0}
.helen-composer{display:flex;align-items:flex-end;gap:9px;border:1px solid var(--line);background:var(--glass2);border-radius:13px;padding:6px 7px 6px 11px}
.helen-composer textarea{display:block;flex:1;resize:none;min-width:0;max-height:95px;min-height:32px;outline:none;border:0;background:transparent;font-family:inherit;font-size:13px;line-height:1.4;padding:7px 2px;color:var(--ink);user-select:text;-webkit-user-select:text}
.helen-composer textarea:focus{outline:0}
.helen-send{display:grid;place-items:center;flex-shrink:0;width:37px;height:37px;border-radius:10px;background:linear-gradient(132deg,#617cf2,#518fd8);color:#fff;font-size:17px;font-weight:750}
.helen-send:disabled{opacity:.45;cursor:not-allowed}
.helen-tools{display:flex;justify-content:space-between;gap:7px;align-items:center;padding:0 0 7px}
.helen-tools button{color:var(--muted);border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:10px}
.helen-tools button:hover{color:var(--ink);background:rgba(117,145,213,.15)}
.helen-composer-help{font-size:9px;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between;gap:8px}

0 4 18 4 18 0V5M3 12c0 4 18 4 18 0"/>'};
const I=n=>`<span class="i"><svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.apps}</svg></span>`;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const appDefs=[{id:'welcome',name:'Overview',ico:'home',shade:'purple'},{id:'files',name:'Files',ico:'folder',shade:'amber'},{id:'engine',name:'Engine Hub',ico:'apps',shade:'purple'},{id:'helen',name:'Helen',ico:'brain',shade:'rose'},{id:'notes',name:'Helen Notes',ico:'file',shade:'amber'},{id:'pastchats',name:'Past Chats',ico:'clock',shade:'purple'},{id:'memory',name:'Helen Memory',ico:'database',shade:'purple'},{id:'journal',name:'Journal',ico:'book',shade:'rose'},{id:'goals',name:'Goals & Projects',ico:'activity',shade:'teal'},{id:'preferences',name:'Preferences',ico:'spark',shade:'slate'},{id:'knowledge',name:'Knowledge Base',ico:'book',shade:'amber'},{id:'system',name:'System',ico:'monitor',shade:'teal'},{id:'controller',name:'Controller Lab',ico:'pad',shade:'slate'},{id:'settings',name:'Appearance',ico:'settings',shade:'slate'}];
const store=k=>{try{return localStorage.getItem(k)}catch{return null}};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let theme=store('helen-handheld-theme')||'aurora',motion=store('helen-handheld-motion')||'flow';function applyTheme(){document.documentElement.dataset.theme=theme;document.documentElement.dataset.motion=motion}applyTheme();
let mode='demo',host='',windows=new Map(),z=10,focused='';const filesDemo={'Welcome.txt':'HELEN Handheld Edition\n\nThis is a visual demo. No PC access is required.','Projects/Ideas.txt':'- Helen Engine integration\n- Shared Python memory\n- BuildView XR\n- Bible Workbench','Notes.md':'# My notes\n\nAn AI-centered handheld computer.'};
const panelPos=(id)=>{let n=windows.size;const vw=innerWidth,vh=innerHeight;const landscape=vw>vh;return{left:landscape?Math.min(vw*.275,260)+n*14:vw*.06,top:landscape?11+n*10:vh*.30,width:landscape?Math.min(640,Math.max(340,vw*.62)):vw*.88,height:landscape?Math.min(365,Math.max(190,vh-116)):Math.min(500,vh*.55)}};
function buildIcons(){$('#desktop-icons').innerHTML=appDefs.slice(1).map(a=>`<button class="desktop-icon" data-open="${a.id}" title="${a.name}"><span class="app-icon ${a.shade}">${I(a.ico)}</span><span>${a.name}</span></button>`).join('')}

function toast(t){let el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(el.timer);el.timer=setTimeout(()=>el.hidden=true,2600)}
// Handheld chat UI; messages remain in memory while the page is open. PC keeps a separate mirrored log.
let phoneChat=[],chatBusy=false,chatDraft='',chatHistoryLoaded=false,chatHistoryRequest=0,chatError='';
// Speech settings stay on this phone only. Actual Helen messages still use the existing PC chat route.
let voiceSession=null;
let speechReplies=store('helen-handheld-speak-replies')==='true';
let voiceLanguage=store('helen-handheld-voice-lang')||(navigator.language?.toLowerCase().startsWith('es')?'es-ES':'en-US');
const chatPreview=location.search.includes('preview=chat');
if(chatPreview){phoneChat=[{role:'helen',content:'Hello! The handheld conversation window is ready. This is a visual preview, not an AI response.'},{role:'user',content:'Can we work from the phone desktop?'},{role:'helen',content:'The phone is the interface, and Windows hosts the original Helen engine. Pair them to start a real conversation.'}];chatHistoryLoaded=true}
function helenChatMarkup(){
  const ready=mode==='live';
  const feed=phoneChat.length?phoneChat.map(m=>`<div class="helen-bubble ${m.role==='user'?'user':m.role==='error'?'error':''}"><span class="who">${m.role==='user'?'YOU':m.role==='error'?'STATUS':'HELEN'}</span>${esc(m.content)}</div>`).join(''):`<div class="helen-empty"><span style="font-size:25px">✧</span><strong>Your conversation with Helen</strong>${ready?'Type below to speak with the original Helen running on your computer.':'Connect to your computer to talk to Helen. You can still explore the desktop offline.'}</div>`;
  return `<section class="helen-chat" aria-label="Helen conversation"><div class="helen-chat-top"><div class="labelblock"><span class="helen-presence" aria-hidden="true"></span><div><h1>Helen</h1><p class="small muted">${chatPreview?'VISUAL PREVIEW':ready?'Original engine · Windows PC':'Waiting for Windows host'}</p></div></div><span class="helen-status ${ready?'live':''}" id="helen-presence-state">${voiceSession?'● Listening…':chatBusy?'Thinking…':ready?'● Connected':'○ Offline'}</span></div><div class="helen-feed" id="helen-feed" aria-live="polite">${feed}</div><div class="helen-chat-bottom"><div class="helen-tools"><button type="button" data-helen-refresh="1">↻ Sync conversation</button><button type="button" data-open="pastchats">Past Chats</button><button type="button" data-open="notes">Notes</button><button type="button" data-helen-speak="1" class="${speechReplies?'speech-enabled':''}" title="Phone reads Helen’s replies aloud">${speechReplies?'🔊 Voice on':'🔇 Voice off'}</button><select class="voice-lang" id="helen-voice-lang" aria-label="Dictation language"><option value="en-US" ${voiceLanguage==='en-US'?'selected':''}>English</option><option value="es-ES" ${voiceLanguage==='es-ES'?'selected':''}>Español</option></select><span class="small muted" id="helen-chat-warning">${esc(chatError||(chatHistoryLoaded?'Phone conversation log':'History loads when connected'))}</span></div><div class="helen-voice-state" id="helen-voice-state" role="status" aria-live="polite">Hold the desktop orb to speak · release to send</div><form class="helen-composer" id="helen-compose-form"><textarea id="helen-message-input" rows="1" maxlength="1500" placeholder="${ready?'Message Helen…':'Connect to PC to message Helen…'}" aria-label="Message Helen">${esc(chatDraft)}</textarea><button class="helen-mic ${voiceSession?'listening':''}" type="button" id="helen-mic" data-voice-toggle="1" title="Tap to speak · tap again to send" aria-label="Start or stop microphone dictation" ${chatBusy||!read }
function paintHelenChat({preserveInput=true}={}){

  const feed=document.getElementById('helen-feed');if(feed)feed.scrollTop=feed.scrollHeight;

// Push-to-talk deliberately uses the browser's Web Speech API on the phone.

const RecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
function updateVoiceUI(message='',isError=false){
 const state=document.getElementById('helen-voice-state');
 const text=message||(voiceSession?(voiceSession.stopRequested?'Finishing transcription…':voiceSession.started?'Listening — release or tap again to send':'Starting microphone…'):'Hold the desktop orb to speak · release to send');
 if(state){state.textContent=text;state.classList.toggle('listening',!!voiceSession&&!isError);state.classList.toggle('error',isError)}
 const orbwrap=$('#orbwrap');if(orbwrap){orbwrap.classList.toggle('listening',!!voiceSession&&voiceSession.started&&!voiceSession.stopRequested);orbwrap.classList.toggle('requesting',!!voiceSession&&!voiceSession.started)}

}
function putVoiceDraft(s){
 chatDraft=s.slice(0,1500);
 const field=document.getElementById('helen-message-input');
 if(field){field.value=chatDraft;field.dispatchEvent(new Event('input',{bubbles:true}))}
}
function speakHelenReply(message){

 try{

}
function startVoice(source){

 const s={source,recognition:new RecognitionAPI(),started:false,stopRequested:false,sendOnEnd:false,recognized:'',lastPartial:'',base:(field?.value||chatDraft).trim(),failed:false,done:false,timeout:null};

async function modifyGoal(action,id='',todoId='',completed=false,fields={}){

 if(goalBusy){toast('Another goal change is still saving');paintGoals();return false}

 if(action!=='goal/create'&&!g){toast('Goal not found. Refresh first.');paintGoals();return false}
 const body=action==='goal/create'?{}:{id,rev:g.rev};
 if(action==='goal/create'||action==='goal/rename'){
  if(typeof fields.title!=='string'||!fields.title.trim()){toast('Enter a goal title');return false}

 }
 if(action==='todo/add'){
  if(typeof fields.text!=='string'||!fields.text.trim()){toast('Enter a to-do');return false}
  body.text=fields.text.trim();
 }
 if(action==='todo/toggle'||action==='todo/delete'){
  if(!g.todos.some(t=>t.id===todoId)){toast('To-do not found. Refresh first.');paintGoals();return false}
  body.todoId=todoId;
  if(action==='todo/toggle')body.completed=!!completed;
 }
 goalBusy=true;paintGoals();
 try{

 }catch(e){toast('Could not save: '+e.message);await fetchGoals();return false}
 finally{goalBusy=false;paintGoals()}
}

 inputs.textContent=p?`Active profile: ${controllerActiveProfile().toUpperCase()}\nAxes: ${p.axes.map((v,i)=>`${i}: ${v.toFixed(2)}`).join('  |  ')}\nPressed buttons: ${p.buttons.map((v,i)=>v.pressed||v.value>.55?i:null).filter(v=>v!==null).join(', ')||'none'}\n${padLearnAction?'LEARNING: '+padLearnAction+' · press a button':''}`:'No gamepad input yet.';
 inputs.style.whiteSpace='pre-wrap';
 const desc=$('#pad-profile-current');if(desc)desc.textContent=`Active: ${controllerActiveProfile()==='helen'?'Helen':'Desktop'} profile · editing ${editControllerProfile==='helen'?'Helen':'Desktop'}`;
}
function clock(){let d=new Date();$('#topclock').textContent=$('#taskclock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#taskdate').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'})}clock();setInterval(clock,14000);
window.addEventListener('resize',()=>{px=Math.min(px,innerWidth-25);py=Math.min(py,innerHeight-25);for(let [id,w] of windows)if(!w.max){w.left=Math.min(w.left,Math.max(0,innerWidth-250));w.top=Math.min(w.top,Math.max(0,innerHeight-160));syncWindow(id)}});

buildIcons();taskbar();showWindow('welcome');requestAnimationFrame(gameLoop);
})();
</script>
</body></html>
